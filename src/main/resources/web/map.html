<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Bicycle Route Planner</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="Map.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>

<body>
<div class="page">
    <div id="map"></div>
    <div id="routeStats">
        <div>Distanz: <span id="distance_km">-</span> km</div>
        <div>Anstieg: <span id="elevation_m">-</span> hm</div>
    </div>
    <div class="controls">
        <button type="button" id="resetMarkers">Reset Markers</button>
        <button type="button" id="calculateRoute">Calculate Route</button>
        <label for="rangeSlider">Height vs. Distance Weight:</label> <input type="range" id="rangeSlider" min="0" max="1" step="0.001" value="0"> <span id="sliderValue">0</span>
    </div>
</div>
<script src="LoadMap.js"></script>
</body>
</html>
